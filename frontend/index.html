.creator-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.creator-mini{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.18s}.creator-mini:hover{border-color:#cbbcf0;transform:translateY(-1px)}.creator-avatar{width:42px;height:42px;flex:0 0 42px;font-size:11px}.creator-mini b{display:block;font-size:11.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.creator-mini span{display:block;font-size:9.8px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* CREATOR PUBLIC PROFILE */
.artiva-footer{margin-top:46px;border-top:1px solid var(--line);background:var(--card);padding:38px 34px 28px}.artiva-footer-inner{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:1.15fr repeat(3,1fr);gap:38px}.footer-brand-logo{width:185px;max-width:100%;height:auto;display:block;margin-bottom:15px}.footer-brand p{font-size:10.5px;color:var(--muted);max-width:260px;line-height:1.65}.footer-social{display:flex;gap:8px;margin-top:14px}.footer-social span{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--purple);font-size:11px;font-weight:700}.footer-col h4{font-size:12px;margin:3px 0 13px;color:var(--ink)}.footer-col a{display:block;font-size:10.8px;color:var(--muted);padding:4px 0}.footer-col a:hover{color:var(--purple)}.footer-bottom{max-width:1320px;margin:26px auto 0;padding-top:17px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:9.8px}.creator-head .creator-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}html[data-theme="dark"] .artiva-footer{background:#14171e!important;border-color:#2c313b!important}@media(max-width:850px){.artiva-footer{padding:30px 18px 22px}.artiva-footer-inner{grid-template-columns:1fr 1fr;gap:25px}}@media(max-width:520px){.artiva-footer-inner{grid-template-columns:1fr}.footer-bottom{flex-direction:column}}.creator-profile{max-width:1200px;margin:0 auto}.creator-cover{height:116px;border-radius:18px;background:linear-gradient(120deg,#f0e9ff,#faf8ff 55%,#eaf8ef);border:1px solid var(--line);margin-bottom:-42px}.creator-head{display:flex;align-items:flex-end;gap:16px;padding:0 18px 18px}.creator-head .creator-avatar{width:86px;height:86px;flex:0 0 86px;border:5px solid #fff;font-size:19px;box-shadow:0 5px 18px rgba(0,0,0,.08)}.creator-bio{flex:1}.creator-bio h1{margin:0 0 3px;font-size:24px}.creator-bio p{margin:3px 0;color:var(--muted);font-size:11.5px}.creator-badge{display:inline-flex;background:var(--purple-soft);color:var(--purple);border-radius:999px;padding:4px 8px;font-size:9.5px;font-weight:650}.creator-stats{display:flex;gap:28px;text-align:center}.creator-stats b{display:block;font-size:17px}.creator-stats span{font-size:9.5px;color:var(--muted)}.profile-tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:5px 0 18px}.profile-tabs button{border:0;background:transparent;padding:11px 2px;font-size:11.5px;color:#667086}.profile-tabs button.active{color:var(--ink);font-weight:650;border-bottom:2px solid var(--purple)}

/* V0.6.12 — cards menores + produto refinado + coleções */
.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.thumb{aspect-ratio:4/5;border-bottom:1px solid rgba(0,0,0,.03)}
.card{border-radius:16px}
.card-body{padding:10px 11px 11px}
.card-title{font-size:12px;line-height:1.35;min-height:32px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.seller{font-size:10px}
.meta{font-size:9.5px;margin:6px 0}
.price{font-size:13px}
.add{width:28px;height:28px;font-size:16px}
.explore-top-tabs{display:flex;gap:8px;overflow:auto;padding:0 0 14px;margin-top:8px}
.explore-top-tabs a{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:12px;font-size:11px;color:#566077;font-weight:600}
.explore-top-tabs a.active,.explore-top-tabs a:hover{border-color:#c7b7f2;background:var(--purple-soft);color:var(--purple)}
.collections-tip{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px dashed #d6c8f6;background:#faf7ff;padding:12px 14px;border-radius:15px;margin:0 0 14px;font-size:11px;color:#5a6378}
.collections-tip b{color:var(--ink);display:block;font-size:12px;margin-bottom:2px}
.product-detail{grid-template-columns:minmax(0,1.08fr) minmax(330px,.92fr);gap:24px}
.gallery{border-radius:20px;background:linear-gradient(180deg,#1b1e26,#11131a);padding:16px}
.gallery>img.art{border-radius:16px;aspect-ratio:4/5;object-fit:cover;background:#ece9f6}
.buybox{border-radius:20px;padding:18px;background:var(--card)}
.resource-topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.format-badge{display:inline-flex;align-items:center;gap:8px;background:var(--purple-soft);color:var(--purple);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700}
.format-badge .ps-icon{width:24px;height:24px;border-radius:8px;background:#132640;color:#6cc5ff;display:grid;place-items:center;font-weight:800;font-size:12px}
.resource-actions{display:flex;gap:8px;flex-wrap:wrap}
.resource-icon{width:36px;height:36px;border:1px solid var(--line);background:transparent;border-radius:12px;display:grid;place-items:center;color:#66718a;font-size:15px}
.resource-headline{margin:6px 0 10px;font-size:17px;line-height:1.25}
.feature-list{display:grid;gap:8px;margin:14px 0 16px}
.feature-list div{display:flex;gap:10px;align-items:flex-start;font-size:11.5px;color:var(--ink)}
.feature-list span{width:18px;height:18px;border-radius:50%;background:#e7f8ee;color:#148a4c;display:grid;place-items:center;font-size:11px;flex:0 0 18px;margin-top:1px}
.download-panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(89,35,200,.04),rgba(89,35,200,.01));border-radius:18px;padding:15px;margin-top:12px}
.download-panel .cta-title{font-size:12px;font-weight:700;margin-bottom:8px}
.download-cta{width:100%;border:0;border-radius:14px;padding:14px 16px;background:linear-gradient(90deg,#286bff,#7046ff);color:#fff;font-weight:700;font-size:14px}
.download-cta.alt{background:linear-gradient(90deg,#5923c8,#7c36ff)}
.premium-callout{border:1px solid #2d3040;background:#161922;color:#f0f2f7;border-radius:16px;padding:14px;margin:12px 0}
.premium-callout b{display:block;margin-bottom:6px}
.seller-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px;background:var(--card)}
.seller-mini{display:flex;align-items:center;gap:12px;min-width:0}.seller-mini .creator-avatar{width:44px;height:44px;font-size:13px;flex:0 0 44px}.seller-mini b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.seller-mini span{display:block;font-size:10px;color:var(--muted)}
.collab-tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:var(--purple-soft);color:var(--purple);font-size:9.5px;font-weight:700;margin-top:3px}
.collection-hero{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}
.collection-hero h1{margin:0}
.collection-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:11px;font-weight:600;color:#566077}
html[data-theme="dark"] .collections-tip{background:#181b23;border-color:#383d4a;color:#aab0bd}
html[data-theme="dark"] .gallery{background:linear-gradient(180deg,#0f1117,#090b10)}
html[data-theme="dark"] .download-panel{background:linear-gradient(180deg,rgba(123,79,255,.14),rgba(123,79,255,.04));border-color:#303548}
html[data-theme="dark"] .resource-icon,html[data-theme="dark"] .collection-chip,html[data-theme="dark"] .explore-top-tabs a{background:#1b1e26}

/* ===== ATV V0.6.1 — revisão de tema + navegação inferior ===== */
:root{--bottom-dock-h:72px}
.public-sidebar{display:none!important}
.public-ui .topbar{margin-left:0!important}
.public-ui .container,.public-ui .page,.public-ui .home-wrap{margin-left:0!important}

.topbar{padding:0 24px;gap:16px}

<body><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div><script>(function (root) {
  'use strict';

  const MAX_FILE_BYTES = 80 * 1024 * 1024;
  const MAX_DIMENSION = 10000;
  const MAX_PIXELS = 40_000_000;

  function fail(message, code = 'PSD_PREVIEW_ERROR') {
    const e = new Error(message); e.code = code; throw e;
  }
  function ascii(view, off, n) {
    let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(view.getUint8(off + i)); return s;
  }
  function ensure(view, off, n) { if (off < 0 || n < 0 || off + n > view.byteLength) fail('Arquivo PSD incompleto ou corrompido.', 'PSD_TRUNCATED'); }
  function u16(view, off) { ensure(view, off, 2); return view.getUint16(off, false); }
  function u32(view, off) { ensure(view, off, 4); return view.getUint32(off, false); }

  function parseSections(buffer) {
    const view = new DataView(buffer);
    ensure(view, 0, 26);
    if (ascii(view, 0, 4) !== '8BPS') fail('O arquivo selecionado não é um PSD válido.', 'NOT_PSD');
    const version = u16(view, 4);
    if (version !== 1) fail('Somente arquivos PSD são aceitos nesta etapa (PSB ainda não).', 'PSD_VERSION_UNSUPPORTED');
    const channels = u16(view, 12);
    const height = u32(view, 14);
    const width = u32(view, 18);
    const bitsPerChannel = u16(view, 22);
    const colorMode = u16(view, 24);
    if (!width || !height || width > MAX_DIMENSION || height > MAX_DIMENSION || width * height > MAX_PIXELS) {
      fail('O PSD excede o limite seguro de dimensões da homologação.', 'PSD_DIMENSIONS_LIMIT');
    }
    let off = 26;
    const colorLen = u32(view, off); off += 4; ensure(view, off, colorLen); off += colorLen;
    const resourcesLen = u32(view, off); off += 4; ensure(view, off, resourcesLen);
    const resourcesStart = off, resourcesEnd = off + resourcesLen; off = resourcesEnd;
    const layerMaskLen = u32(view, off); off += 4; ensure(view, off, layerMaskLen); off += layerMaskLen;
    const imageDataOffset = off;
    return { view, version, channels, height, width, bitsPerChannel, colorMode, resourcesStart, resourcesEnd, imageDataOffset };
  }

  function findEmbeddedThumbnail(meta) {
    const { view } = meta;
    let off = meta.resourcesStart;
    const candidates = [];
    while (off + 12 <= meta.resourcesEnd) {
      ensure(view, off, 4);
      const sig = ascii(view, off, 4); off += 4;
      if (sig !== '8BIM' && sig !== 'MeSa') break;
      const id = u16(view, off); off += 2;
      ensure(view, off, 1);
      const nameLen = view.getUint8(off); off += 1;
      ensure(view, off, nameLen); off += nameLen;
      if ((1 + nameLen) % 2 !== 0) off += 1;
      const size = u32(view, off); off += 4;
      ensure(view, off, size);
      const dataStart = off;
      if ((id === 1036 || id === 1033) && size >= 28) {
        const format = u32(view, dataStart);
        const width = u32(view, dataStart + 4);
        const height = u32(view, dataStart + 8);
        const compressedSize = u32(view, dataStart + 20);
        const imageStart = dataStart + 28;
        const available = Math.max(0, Math.min(size - 28, compressedSize || size - 28));
        if (format === 1 && available > 4) {
          candidates.push({ id, width, height, bytes: new Uint8Array(view.buffer, imageStart, available) });
        }
      }
      off = dataStart + size + (size % 2);
    }
    return candidates.sort((a, b) => (b.id === 1036) - (a.id === 1036))[0] || null;
  }

  function decodePackBitsRow(src, expected) {
    const out = new Uint8Array(expected);
    let si = 0, oi = 0;
    while (si < src.length && oi < expected) {
      let n = src[si++]; if (n > 127) n -= 256;
      if (n >= 0 && n <= 127) {
        const count = n + 1;
        for (let i = 0; i < count && si < src.length && oi < expected; i++) out[oi++] = src[si++];
      } else if (n >= -127 && n <= -1) {
        if (si >= src.length) break;
        const value = src[si++], count = 1 - n;
        for (let i = 0; i < count && oi < expected; i++) out[oi++] = value;
      }
    }
    if (oi !== expected) fail('Não foi possível decodificar a imagem composta do PSD.', 'PSD_RLE_ERROR');
    return out;
  }

  async function inflate(bytes) {
    if (typeof DecompressionStream === 'undefined') fail('Este navegador não consegue descompactar este PSD automaticamente.', 'PSD_ZIP_BROWSER_UNSUPPORTED');
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function decodeComposite(meta) {
    const { view, width, height, channels, bitsPerChannel, colorMode } = meta;
    if (bitsPerChannel !== 8) fail('A geração automática nesta versão aceita PSD de 8 bits por canal.', 'PSD_BIT_DEPTH_UNSUPPORTED');
    if (![1, 3].includes(colorMode)) fail('Este modo de cor do PSD ainda exige preview manual nesta versão.', 'PSD_COLOR_MODE_UNSUPPORTED');
    let off = meta.imageDataOffset;
    const compression = u16(view, off); off += 2;
    const planeSize = width * height;
    const decodedPlanes = [];

    if (compression === 0) {
      for (let c = 0; c < channels; c++) {
        ensure(view, off, planeSize);
        decodedPlanes.push(new Uint8Array(view.buffer.slice(off, off + planeSize)));
        off += planeSize;
      }
    } else if (compression === 1) {
      const rowCounts = [];
      for (let i = 0; i < channels * height; i++) { rowCounts.push(u16(view, off)); off += 2; }
      let rowIndex = 0;
      for (let c = 0; c < channels; c++) {
        const plane = new Uint8Array(planeSize);
        for (let y = 0; y < height; y++) {
          const len = rowCounts[rowIndex++]; ensure(view, off, len);
          const row = decodePackBitsRow(new Uint8Array(view.buffer, off, len), width); off += len;
          plane.set(row, y * width);
        }
        decodedPlanes.push(plane);
      }
    } else if (compression === 2 || compression === 3) {
      const zipped = new Uint8Array(view.buffer, off, view.byteLength - off);
      const raw = await inflate(zipped);
      const needed = planeSize * channels;
      if (raw.length < needed) fail('Dados compactados do PSD incompletos.', 'PSD_ZIP_ERROR');
      let ro = 0;
      for (let c = 0; c < channels; c++) {
        const plane = raw.slice(ro, ro + planeSize); ro += planeSize;
        if (compression === 3) {
          for (let y = 0; y < height; y++) {
            const base = y * width;
            for (let x = 1; x < width; x++) plane[base + x] = (plane[base + x] + plane[base + x - 1]) & 255;
          }
        }
        decodedPlanes.push(plane);
      }
    } else {
      fail('Compressão do PSD ainda não suportada para preview automático.', 'PSD_COMPRESSION_UNSUPPORTED');
    }

    const rgba = new Uint8ClampedArray(planeSize * 4);
    if (colorMode === 3) {
      if (decodedPlanes.length < 3) fail('PSD RGB sem canais suficientes.', 'PSD_CHANNELS_INVALID');
      for (let i = 0, j = 0; i < planeSize; i++, j += 4) {
        rgba[j] = decodedPlanes[0][i]; rgba[j + 1] = decodedPlanes[1][i]; rgba[j + 2] = decodedPlanes[2][i]; rgba[j + 3] = decodedPlanes[3] ? decodedPlanes[3][i] : 255;
      }
    } else {
      for (let i = 0, j = 0; i < planeSize; i++, j += 4) {
        const g = decodedPlanes[0][i]; rgba[j] = rgba[j + 1] = rgba[j + 2] = g; rgba[j + 3] = decodedPlanes[1] ? decodedPlanes[1][i] : 255;
      }
    }
    return { rgba, width, height };
  }

  function canvasFromRgba(data) {
    const c = document.createElement('canvas'); c.width = data.width; c.height = data.height;
    const ctx = c.getContext('2d', { alpha: true });
    ctx.putImageData(new ImageData(data.rgba, data.width, data.height), 0, 0);
    return c;
  }

  function loadBlobImage(blob) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob); const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Miniatura incorporada do PSD não pôde ser aberta.')); };
      img.src = url;
    });
  }

  function canvasFromImage(img) {
    const c = document.createElement('canvas'); c.width = img.naturalWidth || img.width; c.height = img.naturalHeight || img.height;
    c.getContext('2d').drawImage(img, 0, 0); return c;
  }

  async function generatePreview(file) {
    if (!file) fail('Selecione um arquivo PSD.');
    if (!/\.psd$/i.test(file.name || '')) fail('Nesta fase, a extensão de arquivo aceita é somente .PSD.', 'PSD_EXTENSION_REQUIRED');
    if (file.size > MAX_FILE_BYTES) fail('O PSD excede 80 MB, limite da homologação.', 'PSD_FILE_TOO_LARGE');
    const buffer = await file.arrayBuffer();
    const meta = parseSections(buffer);
    const thumb = findEmbeddedThumbnail(meta);
    if (thumb) {
      try {
        const img = await loadBlobImage(new Blob([thumb.bytes], { type: 'image/jpeg' }));
        return { canvas: canvasFromImage(img), meta, method: 'THUMBNAIL_EMBUTIDA' };
      } catch (_) { /* cai para imagem composta */ }
    }
    const composite = await decodeComposite(meta);
    return { canvas: canvasFromRgba(composite), meta, method: 'IMAGEM_COMPOSTA' };
  }

  function inspect(buffer) {
    const meta = parseSections(buffer);
    return { signature: '8BPS', version: meta.version, width: meta.width, height: meta.height, channels: meta.channels, bitsPerChannel: meta.bitsPerChannel, colorMode: meta.colorMode, hasEmbeddedThumbnail: !!findEmbeddedThumbnail(meta) };
  }

  root.ArtivaPsd = { generatePreview, inspect, parseSections, findEmbeddedThumbnail, decodeComposite };
})(typeof window !== 'undefined' ? window : globalThis);
</script><script>const $ = (s) => document.querySelector(s);
const app = $('#app');
const state = {
  config: null,
  account: null,
  products: [],
  downloads: { purchased: [], recent: [] },
  library: { favorites: [], collection: [], following: [], cart: [] },
  cart: [],
  lastOrder: null,
  uploadedPreview: null,
  uploadedUploadId: null,
  adminChallenge: null,
  csrfToken: null,
  adminCsrfToken: null,
  catalogRevision: null,
  catalogWatchBusy: false,
  supportPollBusy: false,
  supportLastSignature: '',

  notificationPollBusy: false,

  adminSupportOpen: 0
};

// V0.6.11 — foto de perfil em armazenamento de sessão leve, independente da quota principal.
const PROFILE_KEY='artiva_collaborator_profile_v069';
const PROFILE_PHOTO_KEY='artiva_collaborator_photo_v069';
const FAVORITES_KEY='artiva_v0610_favorites';
const COLLECTION_KEY='artiva_v0623_collection_default';
const FOLLOWING_KEY='artiva_v0623_following';
const MEDIA_DB_NAME='artiva_media_v0623';
const MEDIA_STORE='previews';

function currentCollaboratorName(){
  const p=readCollaboratorProfile();
  return [p.firstName,p.lastName].filter(Boolean).join(' ').trim() || 'Studio Criativo';
}
function currentCollaboratorBio(){
  const p=readCollaboratorProfile();
  return String(p.bio||'').trim() || 'Colaborador ATV especializado em recursos digitais para projetos criativos.';
}
function currentCollaboratorInitials(){
  return currentCollaboratorName().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase() || 'AR';
}
function readCollection(){return (state.collections?.itemIds||state.library?.collection||[]).map(String);}
function isInCollection(id){return readCollection().includes(String(id));}
async function refreshCollections(){
  if(!isAuthenticated()){state.collections={premium:false,collections:[],itemIds:[]};return state.collections;}
  try{state.collections=await api('/api/account/collections?ts='+Date.now(),{cache:'no-store'});}catch{state.collections={premium:false,collections:[],itemIds:[]};}
  state.library.collection=[...(state.collections.itemIds||[])];return state.collections;
}
function updateCollectionButtons(){
  document.querySelectorAll('[data-collection]').forEach(btn=>{const active=isInCollection(btn.dataset.collection);btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',active?'true':'false');btn.title=active?'Organizar nas coleções':'Salvar em coleção';});
  document.querySelectorAll('[data-collection-card]').forEach(btn=>{const active=isInCollection(btn.dataset.collectionCard);btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',active?'true':'false');btn.title=active?'Organizar nas coleções':'Salvar em coleção';});
}
async function openCollectionModal(productId){
  if(!requireAuth({type:'collection',id:String(productId),returnHash:location.hash||'#/home'}))return;
  if(!state.account?.premiumActive){
    if(confirm('Coleções com pastas personalizadas são exclusivas do Premium. Conhecer o Premium?'))location.hash='#/planos';
    return;
  }
  try{
    await refreshCollections();
    document.getElementById('collectionOverlayV87')?.remove();
    const sid=String(productId);
    const product=state.products.find(p=>String(p.id)===sid)||null;
    const el=document.createElement('div');
    el.id='collectionOverlayV87';
    el.className='collection-overlay-v87';
    // IMPORTANTE: o modal entra no DOM antes de ligarmos seus handlers.
    document.body.appendChild(el);

    const render=()=>{
      const cs=state.collections.collections||[];
      const q=(el.dataset.search||'').trim().toLowerCase();
      const visible=cs.filter(c=>!q||String(c.name||'').toLowerCase().includes(q));
      el.innerHTML=`<section class="collection-modal-v871" role="dialog" aria-modal="true" aria-label="Adicionar à coleção">
        <div class="collection-modal-v87-head">
          <div><span class="collection-kicker-v871">BIBLIOTECA PREMIUM</span><h2>Adicionar à coleção</h2><p>Crie pastas com seus próprios nomes e encontre este recurso quando quiser.</p></div>
          <button class="collection-close-v87" data-close-collection aria-label="Fechar">×</button>
        </div>
        ${product?`<div class="collection-product-v871"><img src="${product.image}" alt="${esc(product.title)}"><div><b>${esc(product.title)}</b><span>${esc(product.category)} · ${esc(displayFormats(product).join(' · ')||'ARQUIVO')}</span></div><span class="collection-saved-chip-v871">${isInCollection(sid)?'SALVO':'ORGANIZAR'}</span></div>`:''}
        <div class="collection-toolbar-v871">
          <label class="collection-search-v871"><span>⌕</span><input data-collection-search value="${esc(el.dataset.search||'')}" placeholder="Buscar coleção..."></label>
          <button class="btn light" data-new-collection>+ Nova coleção</button>
        </div>
        <div class="collection-new-v871 ${el.dataset.creating==='1'?'':'hidden'}">
          <input data-new-collection-name class="form-control" maxlength="40" placeholder="Nome da nova coleção">
          <button class="btn" data-create-collection>Criar e salvar</button>
        </div>
        <div class="collection-list-v871">
          ${visible.length?visible.map(c=>{const active=(c.productIds||[]).map(String).includes(sid);return `<button class="collection-choice-v871 ${active?'active':''}" data-collection-choice="${c.id}"><span class="collection-folder-icon-v871">▱</span><span class="collection-choice-copy-v871"><b>${esc(c.name)}</b><small>${c.count} recurso(s)</small></span><span class="collection-check-v871">${active?'✓':'+'}</span></button>`}).join(''):`<div class="collection-empty-v871"><b>${cs.length?'Nenhuma coleção encontrada':'Sua biblioteca ainda não tem pastas'}</b><span>${cs.length?'Tente outro nome.':'Clique em “Nova coleção”, dê um nome e salve este asset.'}</span></div>`}
        </div>
        <div class="collection-footer-v871"><button class="btn light" data-manage-collections>Ver minhas coleções</button><button class="btn" data-finish-collection>Concluir</button></div>
      </section>`;

      const close=()=>el.remove();
      el.querySelector('[data-close-collection]')?.addEventListener('click',close);
      el.querySelector('[data-finish-collection]')?.addEventListener('click',close);
      el.onclick=e=>{if(e.target===el)close();};

      const search=el.querySelector('[data-collection-search]');
      if(search)search.oninput=()=>{el.dataset.search=search.value;render();requestAnimationFrame(()=>{const next=el.querySelector('[data-collection-search]');if(next){next.focus();next.setSelectionRange(next.value.length,next.value.length);}});};

      el.querySelector('[data-new-collection]')?.addEventListener('click',()=>{el.dataset.creating='1';render();requestAnimationFrame(()=>el.querySelector('[data-new-collection-name]')?.focus());});
      el.querySelector('[data-manage-collections]')?.addEventListener('click',()=>{close();location.hash='#/colecoes';});

      el.querySelectorAll('[data-collection-choice]').forEach(b=>b.onclick=async()=>{
        const c=state.collections.collections.find(x=>x.id===b.dataset.collectionChoice);

          b.disabled=true;
          if(active)await api(`/api/account/collections/${c.id}/items/${encodeURIComponent(sid)}`,{method:'DELETE'});
          else await api(`/api/account/collections/${c.id}/items`,{method:'POST',body:JSON.stringify({productId:sid})});

          toast(active?'Removido da coleção':'Salvo na coleção ✓');
        }catch(e){toast(e.message);b.disabled=false;}
      });

      el.querySelector('[data-create-collection]')?.addEventListener('click',async()=>{
        const input=el.querySelector('[data-new-collection-name]');
        const name=input?.value.trim()||'';
        if(!name){input?.focus();return;}
        try{
          const btn=el.querySelector('[data-create-collection]');if(btn){btn.disabled=true;btn.textContent='Criando...';}
          const out=await api('/api/account/collections',{method:'POST',body:JSON.stringify({name})});
          await api(`/api/account/collections/${out.id}/items`,{method:'POST',body:JSON.stringify({productId:sid})});
          await refreshCollections();updateCollectionButtons();el.dataset.creating='0';el.dataset.search='';render();toast('Coleção criada e asset salvo ✓');
        }catch(e){toast(e.message);}
      });
    };
    render();

function syncLibrary(){

function openMediaDb(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)) return resolve(null);
    const req=indexedDB.open(MEDIA_DB_NAME,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(MEDIA_STORE))db.createObjectStore(MEDIA_STORE);};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function savePreviewMedia(key,dataUrl){
  if(!key||!dataUrl)return false;
  try{const db=await openMediaDb();if(!db)return false;await new Promise((ok,no)=>{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).put(dataUrl,key);tx.oncomplete=()=>ok();tx.onerror=()=>no(tx.error);});db.close();return true;}catch{return false;}
}
async function loadPreviewMedia(key){
  if(!key)return '';
  try{const db=await openMediaDb();if(!db)return '';const value=await new Promise((ok,no)=>{const tx=db.transaction(MEDIA_STORE,'readonly');const req=tx.objectStore(MEDIA_STORE).get(key);req.onsuccess=()=>ok(req.result||'');req.onerror=()=>no(req.error);});db.close();return value;}catch{return '';}
}
async function deletePreviewMedia(key){
  if(!key)return false;
  try{const db=await openMediaDb();if(!db)return false;await new Promise((ok,no)=>{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).delete(key);tx.oncomplete=()=>ok();tx.onerror=()=>no(tx.error);});db.close();return true;}catch{return false;}
}
async function hydrateProductMedia(products){
  const list=Array.isArray(products)?products:[];
  await Promise.all(list.map(async p=>{if(p?.previewKey){const stored=await loadPreviewMedia(p.previewKey);if(stored)p.image=stored;}}));
  return list;
}

async function finishAuthFlow(defaultHash='#/home'){
  const pending=readPendingAuthAction();
  clearPendingAuthAction();
  if(!pending){location.hash=defaultHash;return;}
  let target=pending.returnHash||defaultHash;
  if(!state.account?.creatorActive && String(target).startsWith('#/seller')) target='#/home';
  if(pending.type==='addCart'&&pending.id){
    await addCartInternal(String(pending.id),false);
    location.hash=target;
    setTimeout(()=>$('#cartDrawer')?.classList.add('open'),120);
    return;
  }
  if(pending.type==='favorite'&&pending.id){
    toggleFavoriteInternal(String(pending.id));
    location.hash=target;return;
  }
  if(pending.type==='collection'&&pending.id){
    openCollectionModal(String(pending.id));
    location.hash=target;return;
  }
  if(pending.type==='follow'&&pending.seller){
    location.hash=target;setTimeout(()=>toggleFollowing(String(pending.seller),document.querySelector(`.followSeller[data-seller="${CSS.escape(String(pending.seller))}"]`)),180);return;
  }
  if(pending.type==='download'&&pending.id&&pending.source){
    location.hash=target;setTimeout(()=>consumeDownload(String(pending.id),pending.source),220);return;
  }
  if(pending.type==='checkout'){
    location.hash='#/checkout';return;
  }
  location.hash=target;
  setTimeout(()=>toast('Conta conectada ✓ Continue de onde parou.'),120);
}

function syncBrandLogos(){
  const dark=document.documentElement.dataset.theme==='dark',branding=state.config?.branding||{};
  // No Admin, "logo clara" é a versão clara para fundo escuro; "logo escura" é a versão para fundo claro.
  const hasCustom=!!(branding.logoLight||branding.logoDark);
  const src=hasCustom?(dark?(branding.logoLight||ARTIVA_LOGO_DARK):(branding.logoDark||ARTIVA_LOGO_LIGHT)):(dark?ARTIVA_LOGO_DARK:ARTIVA_LOGO_LIGHT);
  document.querySelectorAll('.brand-dynamic').forEach(img=>{img.src=src;img.style.filter='none';});
  const fav=branding.favicon;if(fav){let l=document.querySelector('link[rel="icon"]');if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l)}l.href=fav;}
}

function resizeProfilePhoto(file, done){
  if(!file || !/^image\/(png|jpeg|webp)$/i.test(file.type||'')){ toast('Escolha uma imagem PNG, JPG ou WebP.'); return; }
  const reader=new FileReader();
  reader.onerror=()=>toast('Não foi possível ler essa imagem.');
  reader.onload=()=>{
    const img=new Image();

      const size=112,c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d');

      const scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      let quality=.56;
      let data=c.toDataURL('image/jpeg',quality);
      // Se ainda vier grande, comprime mais uma vez sem alterar o tamanho visual do avatar na interface.
      if(data.length>48000){quality=.42;data=c.toDataURL('image/jpeg',quality);}

async function validateUploadSignature(file,ext){
  const buf=new Uint8Array(await file.slice(0,16).arrayBuffer());
  const e=String(ext||'').toLowerCase();
  const isPsd=buf.length>=4&&buf[0]===0x38&&buf[1]===0x42&&buf[2]===0x50&&buf[3]===0x53;
  const isPng=buf.length>=8&&buf[0]===0x89&&buf[1]===0x50&&buf[2]===0x4E&&buf[3]===0x47&&buf[4]===0x0D&&buf[5]===0x0A&&buf[6]===0x1A&&buf[7]===0x0A;
  const isJpg=buf.length>=3&&buf[0]===0xFF&&buf[1]===0xD8&&buf[2]===0xFF;
  if(e==='psd'&&!isPsd)throw new Error('O arquivo possui extensão PSD, mas a assinatura interna não corresponde a um PSD válido.');
  if(e==='png'&&!isPng)throw new Error('O arquivo possui extensão PNG, mas o conteúdo não corresponde a um PNG válido.');
  if((e==='jpg'||e==='jpeg')&&!isJpg)throw new Error('O arquivo possui extensão JPG/JPEG, mas o conteúdo não corresponde a uma imagem JPEG válida.');
  return true;
}

const api = async (url, opts = {}) => {
  const timeout=Number(opts.timeout||20000),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const requestOpts={...opts};delete requestOpts.timeout;
    const isForm=requestOpts.body instanceof FormData;
    const headers={...(requestOpts.headers||{})};
    if(!isForm&&!headers['Content-Type'])headers['Content-Type']='application/json';
    if(state.csrfToken&&requestOpts.method&&requestOpts.method.toUpperCase()!=='GET')headers['X-CSRF-Token']=state.csrfToken;
    if(state.adminCsrfToken&&String(url).startsWith('/api/admin/')&&requestOpts.method&&requestOpts.method.toUpperCase()!=='GET')headers['X-Admin-CSRF-Token']=state.adminCsrfToken;
    const r=await fetch(url,{credentials:'same-origin',...requestOpts,headers,signal:requestOpts.signal||controller.signal});
    const ct=r.headers.get('content-type')||'';const data=ct.includes('application/json')?await r.json().catch(()=>({})):await r.text();
    if(!r.ok)throw new Error((data&&data.detail)||(data&&data.error)||`Erro na API (${r.status})`);
    return data;
  }catch(e){if(e?.name==='AbortError')throw new Error('A solicitação demorou mais do que o esperado. Tente novamente.');throw e;}finally{clearTimeout(timer);}
};

async function pollSupportUpdates(){

    const latest=latestAdminMessageAt(d),box=$('#supportWidget');

    if(open){if(latest){saved.lastSeenAdminAt=latest;writeSupportThread(saved);}setSupportUnread(false);if(signature!==state.supportLastSignature)await renderSupportWidget(true,d);}
    else setSupportUnread(!!latest&&latest!==saved.lastSeenAdminAt);

async function consumeDownload(productId, source) {
  if(!requireAuth({type:'download',id:String(productId),source,returnHash:location.hash||'#/home'}))return;
  try {
    const rp=state.products.find(x=>String(x.id)===String(productId));
    if(rp?.deliveryMode==='CANVA'){
      const out=await api(`/api/products/${encodeURIComponent(productId)}/external-access`,{method:'POST',body:'{}'});
      if(out.url)window.open(out.url,'_blank','noopener,noreferrer');
      await refreshAccount();await refreshDownloads();toast((out.alreadyCountedToday?'Canva liberado novamente — este recurso já foi contado hoje.':out.message)+' ✓');return;
    }
    const out=await api('/api/downloads/consume',{method:'POST',body:JSON.stringify({productId,source})});
    if(out.downloadUrl){
      const a=document.createElement('a');a.href=out.downloadUrl;a.download='';a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1500);
      let attempts=0;
      const syncWhenRecorded=async()=>{
        attempts++;
        try{
          const me=await api(`/api/reviews/me/${encodeURIComponent(productId)}?ts=${Date.now()}`,{cache:'no-store',timeout:8000});
          if(me.eligible){
            await refreshAccount();await refreshDownloads();
            const quota=document.querySelector('.quota-mini');
            if(quota){const wrap=document.createElement('div');wrap.innerHTML=quotaChip();const next=wrap.firstElementChild;if(next)quota.replaceWith(next);}
            if(!me.rating)promptProductRating(productId,rp?.title||'Recurso ATV');
            return;
          }
        }catch{}
        if(attempts<8)setTimeout(syncWhenRecorded,650);
      };
      setTimeout(syncWhenRecorded,450);
    }
    toast((out.alreadyCountedToday?'Download liberado novamente — este recurso já foi contado hoje.':out.message)+' ✓');
  }catch(e){toast(e.message);}
}

async function applyWatermarkToCanvas(source,outputType='image/jpeg'){
  const max=1800,scale=Math.min(1,max/Math.max(source.width,source.height));
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(source.width*scale)); c.height=Math.max(1,Math.round(source.height*scale));

  const cfg = state.config?.watermark || { opacity:.18, scale:.22, rotation:-26 };

async function admin() {
  if(!await requireAdminUI())return;
  const s=await api('/api/admin/summary');
  const body=`<div class="admin-kpi-grid">
    <div class="kpi"><div class="label">Clientes</div><div class="value">${s.clients}</div><div class="positive">Contas cadastradas</div></div>
    <div class="kpi"><div class="label">Colaboradores</div><div class="value">${s.collaborators}</div><div class="positive">Perfis habilitados</div></div>
    <div class="kpi"><div class="label">Assets</div><div class="value">${s.totalAssets}</div><div class="positive">${s.publishedAssets} publicados</div></div>
    <div class="kpi admin-alert-kpi"><div class="label">Aguardando aprovação</div><div class="value">${s.pendingProducts}</div><div class="positive">Fila de revisão</div></div>
    <div class="kpi ${s.openSupportTickets?'admin-alert-kpi':''}"><div class="label">Atendimentos novos</div><div class="value">${s.openSupportTickets||0}</div><div class="positive">${s.openSupportTickets?'Requer atenção':'Nenhum chamado aberto'}</div></div>
    <div class="kpi"><div class="label">Vendas hoje</div><div class="value">${s.todaySales}</div><div class="positive">${brl(s.todayVolume)} movimentados</div></div>
    <div class="kpi"><div class="label">Assinaturas</div><div class="value">${s.activeSubscriptions}</div><div class="positive">Premium ativas</div></div>
    <div class="kpi"><div class="label">Denúncias</div><div class="value">${s.reports}</div><div class="positive">Em aberto</div></div>
    <div class="kpi"><div class="label">Administradores</div><div class="value">${s.admins}</div><div class="positive">Acessos ativos</div></div>
    <div class="kpi founder-kpi"><div class="label">Premium Fundadores</div><div class="value">${s.founderPremium?.claimed||0}/${s.founderPremium?.limit||10}</div><div class="positive">${s.founderPremium?.enabled?'Campanha aberta':s.founderPremium?.full?'Vagas preenchidas':'Campanha pausada'}</div></div>
  </div>
  <div class="dash-grid">
    <section class="panel"><div class="admin-panel-head"><h3>⚠️ Itens aguardando aprovação</h3><a href="#/admin/aprovacoes">Abrir fila →</a></div>
      <p><b>${s.pendingProducts}</b> assets precisam de decisão administrativa.</p>
      <div class="admin-status-row"><span>Publicados <b>${s.publishedAssets}</b></span><span>Reprovados <b>${s.rejectedAssets}</b></span><span>Suspensos <b>${s.suspendedAssets}</b></span></div>
    </section>
    <section class="panel"><div class="admin-panel-head"><h3>Gateway</h3><a href="#/admin/pagamentos">Pagamentos →</a></div>
      <div class="gateway-admin-state ${state.config?.gatewayFee?.configured?'ok':'pending'}">${state.config?.gatewayFee?.configured?'✓ Configurado':'⏳ Integração pendente'}</div>
      <p class="small muted">A estrutura financeira está isolada para receber o gateway definido pela ATV.</p>
    </section>
  </div>
  <div class="dash-grid">
    <section class="panel"><div class="admin-panel-head"><h3>Assets mais vendidos</h3><a href="#/admin/assets">Catálogo →</a></div>
      ${s.topAssets.length?`<table class="table"><thead><tr><th>Asset</th><th>Colaborador</th><th>Vendas</th></tr></thead><tbody>${s.topAssets.map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.seller)}</td><td>${p.sales||0}</td></tr>`).join('')}</tbody></table>`:'Sem vendas registradas.'}
    </section>
    <section class="panel"><h3>Configurações comerciais</h3>
      <table class="table"><tr><td>Free</td><td>${s.freeDownloadsPerMonth} downloads/mês</td></tr><tr><td>Premium mensal</td><td>${brl(s.premiumMonthly)}</td></tr><tr><td>Premium anual</td><td>${brl(s.premiumAnnual)}</td></tr><tr><td>Compra avulsa</td><td>${brl(state.config.individualPurchase.price)}</td></tr></table>
      <a class="btn light" href="#/admin/planos">Gerenciar planos</a>
    </section>

    eyebrow:'DIREITOS AUTORAIS',
    title:'Criatividade merece respeito.',
    intro:'A ATV valoriza quem cria e também quem utiliza recursos digitais. Por isso, todo conteúdo disponibilizado na plataforma deve respeitar os direitos de seus respectivos autores.',
    content:`<section class="info-section"><h2>Quem é responsável pelo arquivo?</h2><p>O criador ou colaborador que envia um recurso para a ATV é responsável por garantir que possui os direitos necessários para disponibilizá-lo.</p><p>Isso inclui, quando aplicável:</p><ul><li>Imagens;</li><li>Ilustrações;</li><li>Vetores;</li><li>Fotografias;</li><li>Fontes;</li><li>Personagens;</li><li>Marcas;</li><li>Elementos gráficos;</li><li>Outros materiais de terceiros.</li></ul></section>
    <section class="info-section"><h2>Posso usar qualquer elemento em uma arte?</h2><p><strong>Não.</strong></p><p>Um elemento estar disponível na internet não significa que ele possa ser utilizado livremente.</p><p>Antes de disponibilizar um recurso, o criador deve verificar se possui autorização ou licença para utilizar todos os elementos presentes nele.</p></section>
    <section class="info-section"><h2>Encontrei um conteúdo que parece violar meus direitos. O que faço?</h2><p>Você pode utilizar a opção <strong>"Denunciar conteúdo"</strong> disponível na ATV.</p><p>Informe qual é o conteúdo, explique o motivo da denúncia e, quando possível, apresente informações que ajudem na análise.</p><div class="info-cta-row"><a class="btn" href="#/denunciar">Denunciar conteúdo</a></div></section>
    <section class="info-section"><h2>O conteúdo é removido automaticamente?</h2><p><strong>Não.</strong></p><p>A denúncia será analisada pela ATV.</p><p>Dependendo do caso, poderão ser solicitadas informações adicionais ao responsável pelo conteúdo.</p><p>Se for identificada uma violação, poderão ser tomadas as medidas necessárias, incluindo a remoção do material.</p></section>
    <section class="info-section"><h2>Tenho dúvidas sobre um direito autoral?</h2><p>Entre em contato com o suporte da ATV e explique a situação.</p><div class="info-cta-row"><a class="btn light" href="#/suporte">Entrar em contato</a></div></section>`
  });
}
function reportPage(){
  footerInfoPage({
    eyebrow:'DENÚNCIA',
    title:'Encontrou algo que não deveria estar aqui?',
    intro:'Ajude a manter a ATV segura para todos. Se você acredita que um recurso viola direitos autorais, contém conteúdo inadequado ou infringe as regras da plataforma, você pode enviar uma denúncia.',
    content:`<section class="info-section"><h2>O que podemos denunciar?</h2><ul><li>Possível violação de direitos autorais;</li><li>Uso não autorizado de conteúdo;</li><li>Uso indevido de marcas;</li><li>Conteúdo ilegal;</li><li>Conteúdo inadequado;</li><li>Recurso que viola as regras da ATV;</li><li>Outras situações que precisam ser analisadas.</li></ul></section>
    <section class="info-section"><h2>Como funciona?</h2><div class="process-grid">
      <div class="process-step"><div class="process-num">1</div><b>Informe seus dados</b><span>Nome e e-mail para que a equipe possa entrar em contato, caso necessário.</span></div>
      <div class="process-step"><div class="process-num">2</div><b>Identifique o recurso</b><span>Informe o link ou outra identificação do conteúdo denunciado.</span></div>
      <div class="process-step"><div class="process-num">3</div><b>Escolha o motivo</b><span>Selecione o motivo que melhor representa sua denúncia.</span></div>
      <div class="process-step"><div class="process-num">4</div><b>Explique o que aconteceu</b><span>Descreva detalhadamente o problema.</span></div>
      <div class="process-step"><div class="process-num">5</div><b>Envie evidências</b><span>Quando necessário, envie documentos ou evidências que ajudem na análise.</span></div>
    </div></section>
    <section class="info-section"><h2>Enviar denúncia</h2><form id="reportForm" class="info-form"><div class="info-form-grid">
      <label>Nome<input required name="name" autocomplete="name"></label>
      <label>E-mail<input required name="email" type="email" autocomplete="email"></label>
      <label class="full">Link/identificação do recurso<input required name="resource"></label>
      <label class="full">Motivo da denúncia<select required name="reason"><option value="">Selecione um motivo</option><option>Possível violação de direitos autorais</option><option>Uso não autorizado de conteúdo</option><option>Uso indevido de marcas</option><option>Conteúdo ilegal</option><option>Conteúdo inadequado</option><option>Recurso que viola as regras da ATV</option><option>Outra situação</option></select></label>
      <label class="full">Descrição<textarea required name="description"></textarea></label>
      <label class="full">Anexo/evidência <span class="muted" style="font-weight:500">(opcional)</span><input type="file" name="evidence"></label>
    </div><button class="btn" type="submit">Enviar denúncia</button></form></section>
    <section class="info-section"><h2>O conteúdo será removido imediatamente?</h2><p><strong>Não necessariamente.</strong></p><p>Uma denúncia gera uma solicitação de análise.</p><p>A ATV poderá avaliar o conteúdo, entrar em contato com o responsável e tomar as medidas cabíveis de acordo com a situação.</p></section>
    <section class="info-section"><h2>Faça denúncias com responsabilidade</h2><p>Não utilize o sistema de denúncias para prejudicar outros usuários ou criadores.</p><p>Informações falsas ou denúncias feitas de má-fé podem ser analisadas como violação das regras da plataforma.</p></section>`
  });
  const form=$('#reportForm'); if(form) form.onsubmit=async e=>{
    e.preventDefault();
    const btn=form.querySelector('button[type="submit"]'),fd=new FormData(form),file=fd.get('evidence');
    const evidence=file&&file.name?{name:file.name,size:file.size,type:file.type}:null;
    try{
      btn.disabled=true;btn.textContent='Registrando...';
      const out=await api('/api/reports',{method:'POST',body:JSON.stringify({name:fd.get('name'),email:fd.get('email'),resource:fd.get('resource'),reason:fd.get('reason'),description:fd.get('description'),evidence})});
      form.reset();
      form.insertAdjacentHTML('afterend',`<div class="info-note protocol-note"><b>Denúncia registrada ✓</b><br>Protocolo de homologação: <strong>${esc(out.protocol)}</strong><br><span>A denúncia foi registrada no backend central. O anexo ainda é registrado apenas como metadado nesta fase.</span></div>`);
      toast('Denúncia registrada ✓');
    }catch(err){toast(err.message)}
    finally{btn.disabled=false;btn.textContent='Enviar denúncia';}
  };
}

async function route() {
  try {
    window.scrollTo({top:0,left:0,behavior:'auto'});
    if(!window.__atvBuildVerified){
      const h=await api('/api/health?ts='+Date.now(),{cache:'no-store',timeout:8000});
      if(h?.build!==ATV_BUILD)throw new Error(`Versão incorreta em execução. Frontend ${ATV_BUILD} / servidor ${h?.build||'desconhecido'}. Feche a ATV anterior e abra novamente pelo INICIAR-ATV.bat.`);
      window.__atvBuildVerified=true;
    }
    if (!state.config) state.config = await api('/api/config?ts='+Date.now(),{cache:'no-store'});
    if(!state.catalogRevision){
      try{state.catalogRevision=(await api('/api/catalog/revision?ts='+Date.now(),{cache:'no-store'})).revision||null;}catch{}
    }
    applyPlatformConfig();
    await refreshAccount();
    await refreshLibrary();
    if(isAuthenticated())await refreshNotifications();else state.notifications={unreadCount:0,items:[]};
    const raw = location.hash || '#/home'; const path = raw.split('?')[0];
    const catalogRoute=path==='#/'||path==='#'||path==='#/home'||path==='#/explorar'||path.startsWith('#/produto/')||path.startsWith('#/criador-publico/')||path.startsWith('#/colaborador/')||path.startsWith('#/seller/recurso/')||path==='#/creator';
    if (!state.products.length || catalogRoute) await refreshProducts();
    if (isAuthenticated()&&!state.downloads.purchased.length&&!state.downloads.recent.length) await refreshDownloads();
    if(!isAuthenticated())state.downloads={purchased:[],recent:[]};
    updateDocumentMeta(path);
    if (path === '#/' || path === '#' || path === '#/home') return home();
    if (path === '#/cadastro') { const qp=new URLSearchParams((raw.split('?')[1]||'')); return signupPage(qp.get('origem')||'',qp.get('mode')||''); }
    const privatePaths=['#/conta','#/favoritos','#/checkout','#/downloads'];
    const sellerPath=path==='#/seller'||path.startsWith('#/seller/');
    if(privatePaths.includes(path)&&!isAuthenticated()){home();setTimeout(()=>showAuthModal({type:'route',returnHash:raw}),20);return;}
    if(sellerPath&&!isAuthenticated()){home();setTimeout(()=>showAuthModal({type:'route',returnHash:raw}),20);return;}
    if(sellerPath&&(!hasRole('collaborator')||!state.account?.creatorActive)){
      location.hash='#/home';
      setTimeout(()=>toast('Seu perfil de Colaborador está suspenso. Sua área de Cliente continua ativa.'),60);
      return;
    }
    if (path === '#/explorar') return explore();
    if (path.startsWith('#/produto/')) return product(decodeURIComponent(path.split('/').pop()));
    if (path === '#/planos') return plans();
    if (path === '#/colecoes') return collectionsPage();
    if (path === '#/conta') return accountPage();
    if (path === '#/favoritos') return favoritesPage();
    if (path === '#/checkout') return checkout();
    if (path === '#/sucesso') return success();
    if (path === '#/downloads') return downloads();
    if (path === '#/sobre') return aboutPage();
    if (path === '#/suporte') return supportPage();
    if (path === '#/privacidade') return privacyPage();
    if (path === '#/termos') return termsPage();
    if (path === '#/termos-colaborador') return collaboratorTermsPage();
    if (path === '#/direitos-autorais') return copyrightPage();
    if (path === '#/denunciar') return reportPage();
    if (path === '#/creator') return creatorPage();
    if (path.startsWith('#/seller/recurso/')) return product(decodeURIComponent(path.split('/').pop()),true);
    if (path.startsWith('#/colaborador/')) return collaboratorProfile(decodeURIComponent(path.split('/').pop()));
    if (path.startsWith('#/criador-publico/')) return creatorPublic(decodeURIComponent(path.split('/').pop()));
    if (path === '#/seller') return seller();
    if (path === '#/seller/notificacoes') return sellerNotificationsV871();
    if (path === '#/seller/carteira') return sellerWallet();
    if (path === '#/seller/vendas') return sellerSalesDownloads();
    if (path === '#/seller/saques') return sellerWithdrawals();
    if (path === '#/seller/avaliacoes') return sellerReviews();
    if (path === '#/seller/produtos') return sellerProducts();
    if (path === '#/seller/novo') return sellerNew();
    if (path === '#/admin-login') return adminLogin();
    if (path === '#/admin') return admin();
    if (path === '#/admin/clientes') return adminClients();
    if (path === '#/admin/colaboradores') return adminCollaborators();
    if (path === '#/admin/assets') return adminAssets();
    if (path === '#/admin/aprovacoes'||path === '#/admin/pending') return adminPending();
    if (path === '#/admin/vendas') return adminSales();
    if (path === '#/admin/atendimentos') return adminSupport();
    if (path === '#/admin/pagamentos') return adminPayments();
    if (path === '#/admin/planos'||path === '#/admin/config') return adminPlans();
    if (path === '#/admin/fundadores') return adminFounders();
    if (path === '#/admin/categorias') return adminCategories();
    if (path === '#/admin/destaques') return adminHighlights();
    if (path === '#/admin/aparencia') return adminAppearance();
    if (path === '#/admin/conteudo') return adminContent();
    if (path === '#/admin/configuracoes') return adminGeneral();
    if (path === '#/admin/administradores') return adminAdmins();
    if (path === '#/admin/logs'||path === '#/admin/audit') return adminAudit();
    return home();
  } catch (e) {
    console.error(e); app.innerHTML = `<main class="page"><div class="content-card"><h2>Algo deu errado</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Tentar novamente</button></div></main>`;
  }
}

window.addEventListener('hashchange', route);
window.addEventListener('load', route);
</script></body></html>
